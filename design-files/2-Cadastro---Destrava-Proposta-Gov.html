<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col">
<!-- Fixed Header (TopAppBar variant for Onboarding) -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface shadow-sm px-md py-sm flex flex-col gap-sm">
<div class="flex justify-between items-center w-full">
<div class="flex items-center gap-xs text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">gavel</span>
<span class="font-headline-md text-headline-md-mobile font-bold tracking-tight">Destrava Proposta Gov</span>
</div>
</div>
<!-- Progress Bar Indicator -->
<div class="w-full flex flex-col gap-xs">
<div class="flex justify-between items-center w-full">
<span class="font-label-sm text-label-sm text-on-surface">Cadastro do Licitante</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Passo 1 de 3</span>
</div>
<div class="w-full bg-surface-variant h-2 rounded-full overflow-hidden">
<div class="bg-primary h-full rounded-full transition-all duration-300" style="width: 33.33%;"></div>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 pt-[104px] px-md pb-lg flex flex-col">
<!-- Central White Card -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0_4px_20px_rgba(31,41,55,0.05)] border border-outline-variant/20 flex-1 flex flex-col max-w-[500px] w-full mx-auto">
<div class="mb-lg">
<h1 class="font-headline-md text-headline-md-mobile text-on-surface mb-xs">Dados de Acesso</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Insira suas informações pessoais para criar sua credencial de acesso ao sistema.</p>
</div>
<!-- Form Passo 1 -->
<form class="flex flex-col gap-md flex-1">
<!-- Nome Completo -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="nome">Nome completo</label>
<input class="w-full h-12 px-3 border border-outline rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-outline-variant" id="nome" placeholder="Ex: João da Silva" type="text">
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="email">E-mail corporativo</label>
<input class="w-full h-12 px-3 border border-outline rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-outline-variant" id="email" placeholder="joao@empresa.com.br" type="email">
</div>
<!-- Senha -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="senha">Senha</label>
<div class="relative w-full">
<input class="w-full h-12 px-3 pr-10 border border-outline rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-outline-variant" id="senha" placeholder="••••••••" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
<!-- Strength Meter -->
<div class="flex flex-col gap-1 mt-1">
<div class="flex gap-1 w-full h-1.5">
<div class="flex-1 bg-error rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-[10px]">A senha deve conter no mínimo 8 caracteres, números e símbolos.</span>
</div>
</div>
<!-- Confirmar Senha -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="confirmar_senha">Confirmar senha</label>
<input class="w-full h-12 px-3 border border-outline rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-outline-variant" id="confirmar_senha" placeholder="••••••••" type="password">
</div>
<!-- Submit Button Area -->
<div class="mt-auto pt-lg">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 px-4 rounded-lg flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all" type="button">
                        Continuar
                        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</div>
</form>
</div>
