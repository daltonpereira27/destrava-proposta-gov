<!-- Contact Data -->
<div class="flex flex-col gap-sm mt-4 pt-4 border-t border-outline-variant/30">
<h3 class="font-label-md text-on-surface mb-2">Contato</h3>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-[#1e3a8a] flex items-center gap-2" for="telefone">
            Telefone
</label>
<input class="w-full h-12 px-3 border border-outline rounded-8 bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-outline-variant" id="telefone" placeholder="(00) 00000-0000" type="tel"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-[#1e3a8a] flex items-center gap-2" for="email">
            E-mail da empresa
</label>
<input class="w-full h-12 px-3 border border-outline rounded-8 bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-outline-variant" id="email" placeholder="contato@empresa.com.br" type="email"/>
</div>
</div>
